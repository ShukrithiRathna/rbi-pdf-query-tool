<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBI Document Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
            text-align: center;
        }

        h2 {
            color: #333;
        }

        input {
            width: 60%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .results {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 15px;
            margin: 10px;
            width: 300px;
            text-align: left;
        }

        .card-content {
            font-size: 14px;
            color: #333;
            margin-bottom: 10px;
            white-space: pre-wrap;
            /* Preserve newlines and formatting */
            word-wrap: break-word;
            /* Ensure long words don’t break the layout */
        }

        .card p {
            font-size: 14px;
            color: #555;
        }

        .card a {
            display: block;
            margin-top: 10px;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .card a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h2>Search RBI Documents</h2>
    <input type="text" id="query" placeholder="Enter query..." />
    <button onclick="search()">Search</button>
    <div class="results" id="results"></div>

    <script>
        async function search() {
            let query = document.getElementById("query").value;
            let resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = "Searching...";

            try {
                let response = await fetch("http://127.0.0.1:5000/query", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: query }),
                });

                if (!response.ok) {
                    throw new Error("Server error. Please try again later.");
                }

                let data = await response.json();
                resultsDiv.innerHTML = "";

                if (data.error) {
                    resultsDiv.innerHTML = "<p>Error: " + data.error + "</p>";
                    return;
                }

                if (!data.results || data.results.length === 0) {
                    resultsDiv.innerHTML = "<p>No results found.</p>";
                    return;
                }

                data.results.forEach(res => {
                    let card = document.createElement("div");
                    card.className = "card";

                    let content = document.createElement("div");
                    content.className = "card-content";
                    content.innerHTML = `<p>${res.content.substring(0, 1000)}...</p>`;

                    let link = document.createElement("a");
                    link.href = res.pdf_url;
                    link.textContent = "View Document";
                    link.target = "_blank";

                    card.appendChild(content);
                    card.appendChild(link);
                    resultsDiv.appendChild(card);
                });

            } catch (error) {
                resultsDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
    </script>

</body>

</html>
